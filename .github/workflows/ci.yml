name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q server.py world.py platforms.py setup_icons.py setup_webview.py desktop.py statistics_data.py backend tests
      - name: Windows setup regression tests
        if: runner.os == 'Windows'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_setup_windows.ps1
      - run: node tests/test_inventory_tools.cjs
      - run: python -m unittest discover -s tests -v
      - if: runner.os != 'Windows'
        run: for f in web/*.js; do node --check "$f"; done
        shell: bash

  # One stable context for the ruleset, so adding a matrix cell never needs a ruleset edit.
  test:
    if: ${{ !cancelled() }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: '[ "${{ needs.unit.result }}" = "success" ]'
